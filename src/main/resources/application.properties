# CONFIGURACION GENERAL
quarkus.application.name=inklusport-sports-hub

inklusport.application.name=Inklusport Sports Hub
inklusport.application.version=1.0.0

inklusport.registration.max-per-event=100
inklusport.notifications.enabled=true


# DESARROLLO - POSTGRESQL
%dev.quarkus.http.port=8080
%dev.quarkus.log.level=DEBUG

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/inklusport_db

%dev.quarkus.datasource.jdbc.min-size=2
%dev.quarkus.datasource.jdbc.max-size=10


# TESTING - H2
%test.quarkus.http.test-port=0
%test.inklusport.registration.max-per-event=10

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:inklusport-test;DB_CLOSE_DELAY=-1


# PRODUCCION - POSTGRESQL
%prod.quarkus.http.port=8080
%prod.quarkus.log.level=WARN

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}


# HIBERNATE ORM
quarkus.hibernate-orm.schema-management.strategy=update

%dev.quarkus.hibernate-orm.log.sql=true


# LOGGING
quarkus.log.level=INFO

%dev.quarkus.log.level=DEBUG
%test.quarkus.log.level=INFO
%prod.quarkus.log.level=WARN

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n


# JSON CONFIGURATION
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.serialization-inclusion=non-null


# OPENAPI
quarkus.smallrye-openapi.info-title=Inklusport Sports Hub API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para la gestión de deportistas de Inklusport Sports Hub

quarkus.swagger-ui.always-include=true


# EXTERNAL REST CLIENT
quarkus.rest-client.posts-api.url=https://jsonplaceholder.typicode.com
quarkus.rest-client.posts-api.connect-timeout=2000
quarkus.rest-client.posts-api.read-timeout=3000

# MongoDB configuration
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=inklusport_mongo