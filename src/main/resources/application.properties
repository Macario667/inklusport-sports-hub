# CONFIGURACION GENERAL
quarkus.application.name=inklusport-sports-hub

inklusport.application.name=Inklusport Sports Hub
inklusport.application.version=1.0.0

inklusport.registration.max-per-event=100
inklusport.notifications.enabled=true

# DESARROLLO
%dev.quarkus.http.port=8080
%dev.quarkus.log.level=INFO
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:inklusport;DB_CLOSE_DELAY=-1

# TESTING
%test.quarkus.http.test-port=0
%test.inklusport.registration.max-per-event=10
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:inklusport-test;DB_CLOSE_DELAY=-1

# PRODUCCION
%prod.quarkus.http.port=8080
%prod.quarkus.log.level=WARN

# LOGGING
quarkus.log.level=INFO

# Configuracion por perfil
%dev.quarkus.log.level=DEBUG
%test.quarkus.log.level=INFO
%prod.quarkus.log.level=WARN

# Formato de consola
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# JSON configuration
# No fallar si recibe propiedades JSON que no existen en la clase Java.
# No incluir en las respuestas los atributos cuyo valor sea null.
quarkus.jackson.fail-on-unknown-properties=false
quarkus.jackson.serialization-inclusion=non-null

# DOCUMENTACIONES DE APIS PARA QUE OTROS DESARROLLADORES ENTIENDAN MEJOR
# OpenAPI
quarkus.smallrye-openapi.info-title=Inklusport Sports Hub API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API para la gestión de deportistas de Inklusports Sports Hub

# Swagger UI
quarkus.swagger-ui.always-include=true

# External REST Client
quarkus.rest-client.posts-api.url=https://jsonplaceholder.typicode.com
quarkus.rest-client.posts-api.connect-timeout=2000
quarkus.rest-client.posts-api.read-timeout=3000